<!DOCTYPE html>
<html lang="en"
	xmlns:th="http://www.thymeleaf.org"
>
<!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!-- Latest compiled JavaScript -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<head>
<title>Student Management System</title>
</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	  <a class="navbar-brand" th:href="@{/students}">Student Management System</a>
	  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
	    <span class="navbar-toggler-icon"></span>
	  </button>

	  <div class="collapse navbar-collapse" id="navbarSupportedContent">
	    <ul class="navbar-nav mr-auto">
	      <li class="nav-item active">
	        <a class="nav-link" th:href="@{/students}">Home</a>
	      </li>
		  <li class="nav-item active">
		  	 <a class="nav-link" th:href="@{/students/new}">New Student</a>
		  </li>
	    </ul>
	  </div>
	</nav>
	<br /><br />
	
	<div class="container row col-md-8 offset-md-2">
		<div class="card">
			<div class="card-header">
				<h2 class="text-center">Create New Student</h2>
			</div>
			<div class="card-body">
				<form method="post" role="form" th:action="@{/students}" th:object="${student}">
					<div class="form-group mb-3">
						<label class="form-label">Student First Name</label>
						<input
							class="form-control"
							if="firstName"
							name="firstName"
							placeholder="Enter Student First Name"
							type="text"
							th:field="*{firstName}"
						/>
					</div>
					<div class="form-group mb-3">
						<label class="form-label">Student Last Name</label>
						<input
							class="form-control"
							if="lastName"
							name="lastName"
							placeholder="Enter Student Last Name"
							type="text"
							th:field="*{lastName}"
						/>
					</div>
					<div class="form-group mb-3">
						<label class="form-label">Student Email</label>
						<input
							class="form-control"
							if="email"
							name="email"
							placeholder="Enter Student Email"
							type="email"
							th:field="*{email}"
						/>
					</div>
					<button type="submit" class="btn btn-primary">Submit</button>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
